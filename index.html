    <script>
      // Codextor ships dark in the glass style. First visit: seed "dark" as
      // the saved choice so the pre-paint classes and src/lib/theme.ts agree;
      // learners can still flip the theme (light/dark) and the style
      // (glass/minimal) from Settings, and those choices stick.
      (function () {
        try {
          var saved = localStorage.getItem("codexter-theme");
          if (saved !== "light" && saved !== "dark") {
            saved = "dark";
            localStorage.setItem("codexter-theme", saved);
          }
          if (saved === "dark") document.documentElement.classList.add("dark");

          // Style defaults to glass: only the minimal choice needs a class.
          if (localStorage.getItem("codexter-style") === "minimal") {
            document.documentElement.classList.add("style-minimal");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <!-- Styles for the short notice a reader with scripting off sees in #root.
         With scripts on the notice never renders and React clears it on mount,
         so none of this is visible in a normal visit. Kept deliberately small:
         one message that names the cause, not a second copy of the landing page. -->
    <style>
      .nojs {
        max-width: 34rem;
        margin: 0 auto;
        padding: 4rem 1.25rem;
        font: 16px/1.7 system-ui, -apple-system, sans-serif;
        color: #16204a;
        background: #fff;
      }
      .nojs h1 {
        font-size: 1.6rem;
        line-height: 1.2;
        margin: 0 0 1rem;
      }
      .nojs p {
        margin: 0 0 0.75rem;
      }
    </style>
  </head>
  <body>
    <!--
      The app is client-rendered, so #root is empty in the raw HTML. The notice
      below is the only thing a reader with scripting off ever sees: it names the
      cause and nothing else. It is inert in every normal visit — <noscript> is
      not rendered while scripting is enabled — and React 18 clears #root on
      first render, so nothing survives in the mounted DOM.
    -->
    <div id="root"><noscript>
      <div class="nojs">
        <h1>Codextor needs JavaScript</h1>
        <p>
          Every lesson runs real code in your browser, so the app cannot start
          without scripting. Turn JavaScript on for this site, then reload.
        </p>
        <p>
          Waiting behind it: <!-- counts:hero -->17 tracks · 108 hands-on lessons<!-- /counts:hero -->
          of free, interactive coding lessons.
        </p>
      </div>
    </noscript></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

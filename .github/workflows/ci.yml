name: CI

# The repo had no CI, so "checks are local (tsc, vitest)" was the documented
# status — which means a broken commit could only be caught by whoever ran the
# suite next. This runs the same two commands the README advertises, on every
# push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

# A new push supersedes the previous run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.features }})
    strategy:
      matrix:
        features: [default, all-on]
    env:
      VITE_FLAG_AGENT_INTERNALS: ${{ matrix.features == 'all-on' && '1' || '0' }}
      VITE_FLAG_FIELD_REPORTS: ${{ matrix.features == 'all-on' && '1' || '0' }}
      VITE_FLAG_GIT_WORKTREE_LAB: ${{ matrix.features == 'all-on' && '1' || '0' }}
      VITE_FLAG_BYOK_INTERROGATION: ${{ matrix.features == 'all-on' && '1' || '0' }}
      VITE_FLAG_REVIEWER_CERTIFICATE: ${{ matrix.features == 'all-on' && '1' || '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # `--frozen-lockfile` so a PR that edits package.json without the lockfile
      # fails here instead of silently resolving different versions.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The Worker's API is plain source in sites/api, so the typecheck needs no
      # account and no secrets. The backend tests apply the real D1 schema to
      # Node's built-in SQLite and call the same handlers in-process, so the
      # leaderboard, guild and claim-sync code is covered without a deployment.
      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Feature matrix
        if: matrix.features == 'default'
        run: node scripts/check-features.mjs

      - name: Dependency audit
        run: npm audit --package-lock-only

      # Warning only: tool-dependent lessons past their review window appear as
      # annotations on the run. They do not fail the build.
      - name: Review freshness
        run: node scripts/review-freshness.mjs

  # There is no backend deploy job: the Worker and the SPA ship together from
  # sites/ (see README → Deployment). A push to main still only verifies.

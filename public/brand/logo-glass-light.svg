<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Codexter">
  <!--
    Codexter mark — glass style, light surfaces.

    One hexagon ribbon, folded open at the lower right, with `</>` set inside.
    The same geometry ships in all four files; only the palette changes:

      glass   + light → this file          (violet → indigo → blue)
      glass   + dark  → logo-glass-dark    (violet → indigo → cyan)
      minimal + light → logo-minimal-light (navy band, blue fold)
      minimal + dark  → logo-minimal-dark  (frost white, cool grey fold)

    The group transform scales the mark into the square so the hexagon, not its
    viewBox, sets the rendered size; src/index.css picks the file per theme.
  -->
  <defs>
    <linearGradient id="cx-band" x1="4" y1="1" x2="61" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="0.52" stop-color="#6366f1" />
      <stop offset="1" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cx-fold" x1="37" y1="1" x2="61" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <g
    transform="translate(-5.25 -4.27) scale(1.17)"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- Left half of the ribbon: top vertex, down the left, across the base. -->
    <path
      d="M30 8 L10.08 19.5 L10.08 42.5 L30 54 L43.94 45.95"
      stroke="url(#cx-band)"
      stroke-width="5.6"
    />
    <!-- Right half: the fold, running past the lower-right corner. -->
    <path
      d="M36.97 12.03 L49.92 19.5 L49.92 40.5 L53.6 52.8"
      stroke="url(#cx-fold)"
      stroke-width="5.6"
    />
    <!-- `</>` -->
    <g stroke="#ffffff" stroke-width="4.6">
      <path d="M24.8 23.5 L16.8 31 L24.8 38.5" />
      <path d="M27.5 40.5 L33 21.5" />
      <path d="M35.3 23.5 L43.3 31 L35.3 38.5" />
    </g>
  </g>
</svg>

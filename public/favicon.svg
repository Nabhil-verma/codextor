<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Codexter">
  <!--
    Codexter favicon: the glass/dark mark on an obsidian chip, so the tab icon
    keeps its contrast whether the browser chrome is light or dark. The chip is
    the app's own background (#030305 family), the mark is the same geometry as
    public/brand/ — scaled per the group transform below.
  -->
  <defs>
    <linearGradient id="cx-band" x1="4" y1="1" x2="61" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a855f7" />
      <stop offset="0.52" stop-color="#6366f1" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="cx-fold" x1="37" y1="1" x2="61" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0a0f1e" />
  <g
    transform="translate(2.95 3.7) scale(0.913)"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path
      d="M30 8 L10.08 19.5 L10.08 42.5 L30 54 L43.94 45.95"
      stroke="url(#cx-band)"
      stroke-width="5.6"
    />
    <path
      d="M36.97 12.03 L49.92 19.5 L49.92 40.5 L53.6 52.8"
      stroke="url(#cx-fold)"
      stroke-width="5.6"
    />
    <g stroke="#ffffff" stroke-width="4.6">
      <path d="M24.8 23.5 L16.8 31 L24.8 38.5" />
      <path d="M27.5 40.5 L33 21.5" />
      <path d="M35.3 23.5 L43.3 31 L35.3 38.5" />
    </g>
  </g>
</svg>
